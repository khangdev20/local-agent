# config/default.yaml
# Edit this file for your local environment.

agent:
  model: "llama3.2-vision:11b"             # Default Ollama model for orchestration
  fast_model: ""                 # Optional model for instant no-tool replies, e.g. "qwen2.5:3b"
  ollama_url: "http://localhost:11434"
  max_steps: 15                  # Maximum steps per task
  temperature: 0.2               # Lower = more deterministic
  default_task: |                 # Runs when the user leaves the task empty / clicks Run Default
    There is no user-assigned task right now.
    Research and learn one engineering topic that can be applied to projects:
    system design/architecture, web/app design and UX patterns, coding conventions
    for Next.js, React, Node.js, Fastify, .NET, React Native, NestJS, or related stacks,
    DevOps, CI/CD, observability, deployment, security, reliability.
    Prefer official docs, framework guides, mature engineering blogs,
    and production-grade examples. Summarize concisely in English with:
    the topic studied, key principles, concrete conventions/checklist items,
    how to apply it to a real project, and one follow-up improvement/experiment.
    If a browser/ChatGPT web adapter exists in the tool registry, use it;
    otherwise use web_search.

memory:
  db_path: "~/.local-agent/memory.db"
  max_short_term: 20             # Number of turns kept in context

web:
  host: "0.0.0.0"
  port: 8000

safety:
  auto_confirm: false            # true = skip confirmations (dangerous!)
  privacy_boundary: true         # block secrets/private keys and confirm sensitive/outbound actions
  confirm_external_tools: true   # web_search always asks because queries leave this machine
  blocked_patterns:              # Always blocked
    - "rm -rf /"
    - "format C:"

notifications:
  telegram:
    enabled: false                # Enabled automatically when env vars below are set
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

# Recommended models:
# - qwen3:8b              (8B, default orchestrator/research/planning model)
# Coding/implementation:
# - qwen2.5-coder:7b       (7B, needs ~5GB VRAM, solid for coding)
# - qwen2.5-coder:14b      (14B, needs ~10GB VRAM, stronger)
# - deepseek-coder-v2:16b  (16B, needs ~12GB VRAM, very strong)
# - codellama:7b           (7B, alternative option)
# - mistral:7b             (7B, general purpose)
